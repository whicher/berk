<!-- Portfolio Grid Section -->
<section id="portfolio" class="py-5 bg-white">
  <div class="container py-5">
    <div class="row mb-5">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading display-4 fw-bold mb-3" style="color: #{{ site.data.template.color.primary }};">Ürünlerimiz</h2>
        <h3 class="section-subheading text-muted lead">Geniş ürün yelpazemizle 1986'dan beri hizmetinizdeyiz</h3>
      </div>
    </div>
    <div class="row g-4">
    {% for item in site.urunler %}
      <div class="col-md-4 col-sm-6">
        <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden portfolio-card">
          <a href="{{ item.url | prepend: site.baseurl }}" class="text-decoration-none">
            <div class="portfolio-img-wrapper position-relative overflow-hidden">
              <img src="{{ item.thumbnail | prepend: site.baseurl }}" class="card-img-top" alt="{{ item.alt }}" style="height: 250px; object-fit: cover; transition: transform 0.5s ease;">
              <div class="portfolio-overlay position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-primary bg-opacity-75 opacity-0 transition-overlay">
                <i class="fa fa-link fa-3x text-white"></i>
              </div>
            </div>
            <div class="card-body p-4 text-center">
              <h4 class="card-title fw-bold text-dark mb-1">{{ item.title }}</h4>
              <p class="card-text text-muted fst-italic">{{ item.subtitle }}</p>
            </div>
          </a>
        </div>
      </div>
    {% endfor %}
    </div>
  </div>
</section>

<style>
.portfolio-card:hover .card-img-top {
  transform: scale(1.1);
}
.portfolio-card:hover .transition-overlay {
  opacity: 1 !important;
}
.transition-overlay {
  transition: opacity 0.3s ease;
}
</style>
