<!-- Contact Section -->
<section id="contact" class="py-5" style="background-color: #{{ site.data.template.color.dark }};">
  <div class="container py-5">
    <div class="row mb-5">
        <div class="col-lg-12 text-center text-white">
          <h2 class="section-heading display-4 fw-bold mb-3">İletişim</h2>
          <h3 class="section-subheading lead opacity-75">Sorularınız için bizimle iletişime geçin.</h3>
        </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card border-0 rounded-4 shadow h-100 p-4" style="background-color: rgba(255,255,255,0.05);">
          <div class="card-body text-white">
            <div class="mb-4">
              <h4 class="fw-bold mb-3 text-primary"><i class="fa fa-phone me-2"></i> Telefon</h4>
              <p class="mb-1 fs-5">{{ site.phone }}</p>
              <p class="fs-5">{{ site.gsm }} (GSM)</p>
            </div>
            <div class="mb-4">
              <h4 class="fw-bold mb-3 text-primary"><i class="fa fa-envelope me-2"></i> E-posta</h4>
              <p class="fs-5"><a href="mailto:{{ site.email }}" class="text-white text-decoration-none border-bottom">{{ site.email }}</a></p>
            </div>
            <div class="mb-4">
              <h4 class="fw-bold mb-3 text-primary"><i class="fa fa-map-marker me-2"></i> Adres</h4>
              <p class="fs-5">{{ site.address }}</p>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="card border-0 rounded-4 overflow-hidden shadow h-100">
          <iframe width="100%" height="450" frameborder="0" style="border:0" src="https://www.google.com/maps/embed/v1/place?q=place_id:ChIJSRSYJmLIyhQRJZpYVeE-Dxw&key=AIzaSyCNfEu4AaaHTOdmpBJ8YGlx0mB1F6JDrt8" allowfullscreen></iframe>
        </div>
      </div>
    </div>
  </div>
</section>
